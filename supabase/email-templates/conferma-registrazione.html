<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;color:#0f172a">
  <h2 style="margin:0 0 16px">Benvenuto in Talo</h2>
  <p style="font-size:15px;line-height:1.5">Per completare la registrazione inserisci questo codice nell'app:</p>
  <p style="font-size:32px;font-weight:bold;letter-spacing:8px;background:#f1f5f9;border-radius:12px;padding:16px;text-align:center;margin:24px 0">{{ .Token }}</p>
  <p style="font-size:13px;color:#64748b;line-height:1.5">Il codice scade tra un'ora. Se non hai richiesto tu la registrazione, ignora questa email.</p>
</div>
